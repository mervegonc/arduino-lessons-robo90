<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Ders Serisi</title>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ortak Tasarım Dosyası -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-body">
    <div class="fluid-bg"></div>
    <script src="main.js"></script>
    <header>
        <h1>Arduino Ders Serisi</h1>
        <p>Sıfırdan ileri seviyeye modern gömülü sistem öğrenim günlüğüm</p>
    </header>

    <div class="grid-container" id="gridContainer">
        <!-- JavaScript ile 24 ders otomatik yerleştirilecektir -->
    </div>

    <footer>
        <p>Built with passion by <a href="https://github.com/mervegonc" target="_blank">Merve Göncü</a> • Hosted on GitHub Pages</p>
    </footer>

    <script>
        const lessonsData = {
            1: "Giriş ve Temel Kavramlar",
            2: "Arduino Nedir ve Ekosistem Mimarisi",
            3: "setup() & loop() Mantığı ve Derleme",
            4: "Dijital Pinler, pinMode, digitalWrite ve digitalRead",
            5: "Arduino Syntax (Söz Dizimi), White Space ve Yorum Satırları",
            6: "Arduino Syntax - Noktalı Virgül (;) Kullanımı",
            7: "Değişken Tanımlama ve Veri Tipleri",
            8: "Temel Matematik İşlemleri",
            9: "Karşılaştırma ve Mantık Operatörleri",
            10: "Şartlı İfadeler (if-else if-else)",
            11: "While ve do while Döngüleri",
            12: "for Döngüsü",
            13: "break ve continue İfadeleri",
            14: "Fonksiyonlar",
            15: "Değişken Ömürleri ve Kapsamları",
            16: "Arduino Dijital Pinleri ve Giriş/Çıkış İşlemleri",
            17: "Arduino Const ve Define İfadeleri",
            18: "Arduino ile Analog Giriş İşlemleri",
            19: "Arduino Analog Çıkış İşlemleri ve PWM Tekniği",
            20: "Arduino Antrenmanları (#23 - #27)",
            21: "Switch-Case Kullanımı ve If-Else Farkı",
            22: "Arduino Matematiksel Fonksiyonlar",
            23: "Matematiksel Fonksiyonlar ve Zaman Yönetimi",
            24: "Arduino Proje Geliştirme Süreci (Lesson-34)"
        };

        const container = document.getElementById('gridContainer');
        const totalLessons = 24;

        for (let i = 1; i <= totalLessons; i++) {
            const a = document.createElement('a');
            a.className = 'lesson-box';
            
            if (lessonsData[i]) {
                a.href = `./lesson-${i}`;
                a.innerHTML = `
                    <span class="lesson-num">Bölüm ${i}</span>
                    <span class="lesson-short-title">${lessonsData[i]}</span>
                `;
            } else {
                a.classList.add('disabled');
                a.innerHTML = `
                    <span class="lesson-num">Bölüm ${i}</span>
                    <span class="lesson-short-title">Yakında</span>
                `;
            }
            
            container.appendChild(a);
        }
    </script>
</body>
</html>
